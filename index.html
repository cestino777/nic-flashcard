<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ニック式英語">
<meta name="theme-color" content="#1D9E75">
<link rel="manifest" href="manifest.json">
<title>ニック式 英語フラッシュカード</title>
<style>
  :root {
    --green: #1D9E75; --green-light: #E1F5EE; --green-dark: #0F6E56;
    --red: #E24B4A; --red-light: #FCEBEB;
    --text: #2C2C2A; --text-sub: #5F5E5A; --text-hint: #888780;
    --border: rgba(0,0,0,0.12); --bg: #ffffff; --bg-secondary: #F8F7F4;
    --radius: 16px; --radius-sm: 10px;
    --safe-top: env(safe-area-inset-top,0px);
    --safe-bottom: env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --text:#F1EFE8; --text-sub:#B4B2A9; --text-hint:#888780;
      --border:rgba(255,255,255,0.15); --bg:#1a1a18; --bg-secondary:#232320;
      --green-light:#0a3326; --red-light:#2a1212;
    }
  }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;
    background:var(--bg-secondary); color:var(--text);
    min-height:100vh; display:flex; flex-direction:column;
    padding-top:var(--safe-top); padding-bottom:var(--safe-bottom);
  }
  .header {
    background:var(--bg); border-bottom:0.5px solid var(--border);
    padding:12px 16px; display:flex; align-items:center;
    justify-content:space-between; position:sticky; top:0; z-index:10;
  }
  .header-title { font-size:15px; font-weight:600; }
  .header-stats { display:flex; gap:12px; font-size:13px; font-weight:500; }
  .stat-ok { color:var(--green); } .stat-ng { color:var(--red); }

  .progress-wrap { padding:10px 16px 0; background:var(--bg); }
  .progress-info { display:flex; justify-content:space-between; font-size:12px; color:var(--text-hint); margin-bottom:6px; }
  .progress-bar { height:3px; background:var(--border); border-radius:99px; }
  .progress-fill { height:3px; background:var(--green); border-radius:99px; transition:width 0.4s; }

  .main { flex:1; padding:16px; display:flex; flex-direction:column; gap:12px; }

  /* カード */
  .card {
    background:var(--bg); border:0.5px solid var(--border);
    border-radius:var(--radius); padding:24px 20px;
  }
  /* 表面タップ領域 */
  .front-tap {
    display:flex; flex-direction:column; align-items:center;
    justify-content:center; min-height:160px; cursor:pointer;
  }
  /* 裏面タップ領域（answered=falseの時だけ表→裏へ戻れる） */
  .back-tap-hint {
    font-size:12px; color:var(--text-hint); text-align:center;
    margin-bottom:12px; cursor:pointer; padding:6px;
  }

  .situation-badge {
    display:inline-block; font-size:11px; padding:3px 10px;
    border-radius:99px; background:var(--green-light);
    color:var(--green-dark); font-weight:500; margin-bottom:16px;
  }
  .card-ja { font-size:22px; font-weight:600; line-height:1.5; text-align:center; margin-bottom:12px; }
  .card-tap-hint {
    font-size:12px; color:var(--text-hint); text-align:center;
    margin-top:16px; padding-top:16px; border-top:0.5px solid var(--border);
  }

  .card-en-wrap { display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:10px; }
  .card-en { font-size:20px; font-weight:700; color:var(--green); text-align:center; line-height:1.4; }
  .btn-speak {
    background:none; border:0.5px solid var(--border); border-radius:99px;
    padding:5px 10px; cursor:pointer; color:var(--text-sub); font-size:13px;
    flex-shrink:0;
  }
  .meaning { font-size:13px; color:var(--text-sub); line-height:1.7; padding:10px 0; border-top:0.5px solid var(--border); }
  .examples-title { font-size:11px; font-weight:600; color:var(--text-hint); text-transform:uppercase; letter-spacing:0.06em; margin-top:12px; margin-bottom:8px; }
  .example-item { display:flex; align-items:flex-start; gap:8px; margin-bottom:10px; padding-bottom:10px; border-bottom:0.5px solid var(--border); }
  .example-item:last-child { border-bottom:none; margin-bottom:0; padding-bottom:0; }
  .example-text { font-size:13px; color:var(--text); line-height:1.6; flex:1; }
  .btn-speak-sm { background:none; border:none; cursor:pointer; color:var(--text-hint); font-size:15px; padding:2px; }
  .next-badge { font-size:12px; text-align:center; margin-top:12px; padding-top:12px; border-top:0.5px solid var(--border); color:var(--text-hint); }

  /* ボタン */
  .btn-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .btn-answer {
    padding:15px; border-radius:var(--radius-sm); font-size:15px;
    font-weight:600; cursor:pointer; border:none;
    transition:transform 0.1s, opacity 0.1s;
    -webkit-appearance:none;
  }
  .btn-answer:active { transform:scale(0.97); }
  .btn-answer:disabled { opacity:0.35; pointer-events:none; }
  .btn-ng { background:var(--red-light); color:var(--red); }
  .btn-ok { background:var(--green-light); color:var(--green-dark); }

  .nav-row { display:flex; gap:8px; }
  .btn-nav {
    flex:1; padding:11px; border-radius:var(--radius-sm); font-size:13px;
    cursor:pointer; border:0.5px solid var(--border);
    background:var(--bg); color:var(--text-sub);
    -webkit-appearance:none;
  }
  .btn-nav:disabled { opacity:0.35; pointer-events:none; }

  .filter-bar { display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none; }
  .filter-bar::-webkit-scrollbar { display:none; }
  .btn-filter {
    flex-shrink:0; padding:6px 14px; border-radius:99px; font-size:12px;
    font-weight:500; cursor:pointer; border:0.5px solid var(--border);
    background:var(--bg); color:var(--text-sub); white-space:nowrap;
    -webkit-appearance:none;
  }
  .btn-filter.active { background:var(--green); color:white; border-color:var(--green); }

  .finish-screen { text-align:center; padding:3rem 1rem; }
  .finish-icon { font-size:56px; margin-bottom:16px; }
  .finish-title { font-size:20px; font-weight:600; margin-bottom:8px; }
  .finish-pct { font-size:48px; font-weight:700; color:var(--green); margin-bottom:4px; }
  .finish-sub { font-size:14px; color:var(--text-sub); margin-bottom:24px; }
  .score-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:24px; }
  .score-card { background:var(--bg-secondary); border-radius:var(--radius-sm); padding:12px 8px; }
  .score-num { font-size:24px; font-weight:700; }
  .score-label { font-size:11px; color:var(--text-hint); margin-top:2px; }
  .btn-restart { width:100%; padding:15px; background:var(--green); color:white; border:none; border-radius:var(--radius-sm); font-size:16px; font-weight:600; cursor:pointer; margin-bottom:10px; -webkit-appearance:none; }
  .btn-review { width:100%; padding:15px; background:var(--bg); color:var(--red); border:0.5px solid var(--red); border-radius:var(--radius-sm); font-size:16px; font-weight:600; cursor:pointer; -webkit-appearance:none; }

  .loading { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:4rem 2rem; gap:16px; }
  .spinner { width:36px; height:36px; border:3px solid var(--border); border-top-color:var(--green); border-radius:50%; animation:spin 0.8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .loading-text { font-size:14px; color:var(--text-sub); }
  .offline-banner { background:#F59E0B; color:white; text-align:center; font-size:12px; padding:6px; }
</style>
</head>
<body>

<div class="header">
  <div class="header-title">📚 ニック式 フラッシュカード</div>
  <div class="header-stats">
    <span class="stat-ok" id="hdr-ok">✓ 0</span>
    <span class="stat-ng" id="hdr-ng">✗ 0</span>
  </div>
</div>
<div id="offline-banner" class="offline-banner" style="display:none;">📴 オフラインモード</div>
<div id="root">
  <div class="loading"><div class="spinner"></div><div class="loading-text">読み込み中...</div></div>
</div>

<script>
let ALL_PHRASES = [];

// ============================================================
// データ読み込み
// ============================================================
async function loadPhrases() {
  try {
    const res = await fetch('phrases.json?t=' + Date.now(), { cache:'no-cache' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    ALL_PHRASES = await res.json();
    return true;
  } catch(e) {
    try {
      const res = await fetch('phrases.json');
      if (!res.ok) throw new Error();
      ALL_PHRASES = await res.json();
      document.getElementById('offline-banner').style.display = 'block';
      return true;
    } catch(e2) { return false; }
  }
}

// ============================================================
// SRS
// ============================================================
const SRS_KEY = "nic_srs_v1";
function loadSRS() { try { return JSON.parse(localStorage.getItem(SRS_KEY)||"{}"); } catch(e) { return {}; } }
function saveSRS(srs) { localStorage.setItem(SRS_KEY, JSON.stringify(srs)); }

function getDueCards(phrases, mode) {
  const srs = loadSRS(), today = todayStr();
  let pool = [...phrases];
  if (mode === "due")  pool = pool.filter(p => { const r=srs[p.url]; return !r || r.next_date<=today; });
  if (mode === "weak") pool = pool.filter(p => { const r=srs[p.url]; return r && r.lapses>0; });
  pool.sort((a,b) => {
    const ra=srs[a.url], rb=srs[b.url];
    if (!ra&&!rb) return 0; if (!ra) return -1; if (!rb) return 1;
    return ra.next_date.localeCompare(rb.next_date);
  });
  return pool;
}

function updateSRS(url, correct) {
  const srs = loadSRS(), today = todayStr();
  let r = srs[url] || { interval:0, ease:2.5, lapses:0, reps:0, next_date:today };
  if (correct) {
    r.reps++;
    r.interval = r.interval===0 ? 1 : r.interval===1 ? 3 : Math.round(r.interval*r.ease);
    r.ease = Math.min(2.5, r.ease+0.1);
  } else {
    r.lapses++; r.interval=1; r.ease=Math.max(1.3, r.ease-0.2);
  }
  r.next_date = addDays(today, r.interval);
  srs[url] = r; saveSRS(srs); return r;
}

function getNextLabel(url) {
  const r = loadSRS()[url];
  if (!r) return "初回学習";
  if (r.interval<=1) return "明日";
  if (r.interval<=7) return r.interval+"日後";
  return Math.round(r.interval/7)+"週間後";
}
function todayStr() { return new Date().toISOString().slice(0,10); }
function addDays(s,d) { const dt=new Date(s); dt.setDate(dt.getDate()+d); return dt.toISOString().slice(0,10); }

// ============================================================
// 音声
// ============================================================
function speak(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang="en-US"; u.rate=0.9;
  const v = window.speechSynthesis.getVoices().find(v=>v.lang.startsWith("en")&&v.localService);
  if (v) u.voice=v;
  window.speechSynthesis.speak(u);
}

// ============================================================
// 状態
// ============================================================
let S = {
  phrases:[], current:0,
  flipped:false, answered:false,
  ok:0, ng:0,
  filterMode:"due", finished:false
};

// ============================================================
// 初期化
// ============================================================
async function init() {
  const ok = await loadPhrases();
  if (!ok || !ALL_PHRASES.length) {
    document.getElementById("root").innerHTML =
      `<div class="main"><div class="loading">
        <div class="loading-text">⚠️ データ読み込み失敗</div>
        <button class="btn-restart" style="margin-top:16px" onclick="init()">🔄 再試行</button>
      </div></div>`;
    return;
  }
  startSession("due");
}

function startSession(mode) {
  S.filterMode = mode;
  S.phrases = getDueCards(ALL_PHRASES, mode);
  if (!S.phrases.length && mode==="due") {
    S.phrases = getDueCards(ALL_PHRASES, "all");
    S.filterMode = "all";
  }
  S.current=0; S.flipped=false; S.answered=false;
  S.ok=0; S.ng=0; S.finished=false;
  render();
}

// ============================================================
// レンダリング
// ============================================================
function render() {
  const root = document.getElementById("root");
  if (S.finished) { renderFinish(root); return; }

  const p = S.phrases[S.current];
  const total = S.phrases.length;
  const pct = Math.round((S.current/total)*100);

  // フィルター
  const filters = [{id:"due",label:"📅 今日の復習"},{id:"all",label:"📚 全件"},{id:"weak",label:"💪 苦手のみ"}];
  const filterHtml = filters.map(f=>
    `<button class="btn-filter${S.filterMode===f.id?' active':''}" onclick="startSession('${f.id}')">${f.label}</button>`
  ).join("");

  // 表面
  const frontHtml = `
    <div class="card front-tap" onclick="doFlip()">
      ${p.situation?`<div class="situation-badge">${p.situation}</div>`:''}
      <div class="card-ja">${p.japanese||''}</div>
      <div class="card-tap-hint">👆 タップして英語を確認</div>
    </div>`;

  // 例文
  const exHtml = (p.examples||[]).slice(0,6).map(ex=>
    `<div class="example-item">
      <div class="example-text">${ex}</div>
      <button class="btn-speak-sm" onclick="speak('${ex.replace(/\\/g,'\\\\').replace(/'/g,"\\'")}')">🔊</button>
    </div>`).join("");

  // SRS情報
  const srs = loadSRS()[p.url];
  const nextLabel = S.answered
    ? (S.lastCorrect ? "✓ 次回: "+getNextLabel(p.url) : "✗ 明日また復習")
    : (srs ? "次回: "+getNextLabel(p.url)+"（間隔 "+srs.interval+"日）" : "初回学習");
  const nextColor = S.answered ? (S.lastCorrect?"var(--green)":"var(--red)") : "var(--text-hint)";

  // 裏面
  const backHtml = `
    <div class="card">
      ${!S.answered?`<div class="back-tap-hint" onclick="doFlip()">↩ タップで表に戻る</div>`:''}
      <div class="card-en-wrap">
        <div class="card-en">${p.english||''}</div>
        <button class="btn-speak" onclick="speak('${(p.english||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'")}')">🔊 読む</button>
      </div>
      ${p.meaning?`<div class="meaning">${p.meaning}</div>`:''}
      ${exHtml?`<div class="examples-title">例文</div>${exHtml}`:''}
      <div class="next-badge" style="color:${nextColor}">${nextLabel}</div>
    </div>`;

  // 解答ボタン（answered後はGray out）
  const answerBtns = `
    <div class="btn-row">
      <button class="btn-answer btn-ng" onclick="doAnswer(false)" ${S.answered?'disabled':''}>✗ もう一度</button>
      <button class="btn-answer btn-ok" onclick="doAnswer(true)"  ${S.answered?'disabled':''}>✓ 覚えた！</button>
    </div>`;

  // ナビボタン（answered前は「次へ」disabled）
  const navBtns = `
    <div class="nav-row">
      <button class="btn-nav" onclick="goCard(-1)" ${S.current===0?'disabled':''}>← 前へ</button>
      <button class="btn-nav" onclick="doNext()" ${!S.answered?'disabled':''}>
        ${S.current===total-1?'結果を見る →':'次へ →'}
      </button>
    </div>`;

  root.innerHTML = `
    <div style="background:var(--bg);border-bottom:0.5px solid var(--border);">
      <div class="progress-wrap" style="padding:10px 16px;">
        <div class="progress-info"><span>${S.current+1} / ${total} 問</span><span>${pct}%</span></div>
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      </div>
      <div style="padding:8px 12px 10px;"><div class="filter-bar">${filterHtml}</div></div>
    </div>
    <div class="main">
      ${S.flipped ? backHtml : frontHtml}
      ${answerBtns}
      ${navBtns}
    </div>`;

  document.getElementById("hdr-ok").textContent = "✓ " + S.ok;
  document.getElementById("hdr-ng").textContent = "✗ " + S.ng;
}

function renderFinish(root) {
  const total = S.phrases.length;
  const pct = total>0 ? Math.round((S.ok/total)*100) : 0;
  const emoji = pct>=80?"🎉":pct>=50?"😊":"📖";
  const msg   = pct>=80?"素晴らしい！":pct>=50?"いい調子です！":"コツコツ続けよう！";
  const weak  = S.phrases.filter(p=>{ const r=loadSRS()[p.url]; return r&&r.lapses>0&&r.interval===1; });
  root.innerHTML = `
    <div class="main"><div class="finish-screen">
      <div class="finish-icon">${emoji}</div>
      <div class="finish-title">${msg}</div>
      <div class="finish-pct">${pct}%</div>
      <div class="finish-sub">正解 ${S.ok} / ${total} 問</div>
      <div class="score-grid">
        <div class="score-card"><div class="score-num" style="color:var(--green)">${S.ok}</div><div class="score-label">覚えた</div></div>
        <div class="score-card"><div class="score-num" style="color:var(--red)">${S.ng}</div><div class="score-label">要復習</div></div>
        <div class="score-card"><div class="score-num">${pct}%</div><div class="score-label">正解率</div></div>
      </div>
      <button class="btn-restart" onclick="startSession('due')">🔄 もう一度（今日の復習）</button>
      ${weak.length?`<button class="btn-review" onclick="startSession('weak')">💪 苦手再挑戦 (${weak.length}問)</button>`:''}
    </div></div>`;
  document.getElementById("hdr-ok").textContent = "✓ " + S.ok;
  document.getElementById("hdr-ng").textContent = "✗ " + S.ng;
}

// ============================================================
// アクション
// ============================================================
function doFlip() {
  if (S.answered) return;   // 回答済みは表裏切り替え不可
  S.flipped = !S.flipped;
  render();
  if (S.flipped) {
    const p = S.phrases[S.current];
    if (p && p.english) setTimeout(()=>speak(p.english), 200);
  }
}

function doAnswer(correct) {
  if (S.answered) return;
  S.answered = true;
  S.lastCorrect = correct;
  updateSRS(S.phrases[S.current].url, correct);
  if (correct) S.ok++; else S.ng++;
  render();   // ← 必ずrenderして状態を反映
}

function doNext() {
  if (!S.answered) return;
  if (S.current === S.phrases.length-1) {
    S.finished = true;
  } else {
    S.current++;
    S.flipped = false;
    S.answered = false;
    S.lastCorrect = null;
  }
  render();
}

function goCard(dir) {
  const next = S.current + dir;
  if (next<0 || next>=S.phrases.length) return;
  S.current = next;
  S.flipped = false;
  S.answered = false;
  S.lastCorrect = null;
  render();
}

// ============================================================
// PWA
// ============================================================
if ('serviceWorker' in navigator) {
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('/nic-flashcard/sw.js').catch(()=>{});
  });
}
window.addEventListener('online',  ()=>{ document.getElementById('offline-banner').style.display='none'; });
window.addEventListener('offline', ()=>{ document.getElementById('offline-banner').style.display='block'; });
if (window.speechSynthesis) {
  window.speechSynthesis.onvoiceschanged = ()=>{ window.speechSynthesis.getVoices(); };
}
window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
